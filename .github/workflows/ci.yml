name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  fake-news:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tfg_informatica_fake_news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Sample pipeline and dry-runs
        run: |
          python main.py --use-sample
          python -m scripts.validate_dataset --input data/labeled/fake_news_unified.csv.gz
          python -m scripts.train_baseline --dry-run
          python -m scripts.evaluate_baseline --dry-run
      - name: Run tests
        run: python -m pytest -q

  phishing-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tfg_computadores_phishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: API and benchmark dry checks
        run: |
          python -m pytest -q tests/test_api_endpoints.py
          python -m scripts.benchmark_pipeline --dry-run
